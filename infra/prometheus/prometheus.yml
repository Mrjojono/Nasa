global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: ml_metrics
    metrics_path: /metrics
    static_configs:
      - targets: ["metrics-exporter:9101"]
        labels:
          project: pluie-prevue

  - job_name: fastapi
    metrics_path: /metrics
    scrape_interval: 10s
    static_configs:
      - targets: ["api:8000"]
        labels:
          service: api
